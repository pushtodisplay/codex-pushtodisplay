name: Publish

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type"
        required: true
        type: choice
        options:
          - alpha
          - beta
          - rc
          - stable
      version_bump:
        description: "Version bump"
        required: false
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
      npm_tag:
        description: "Override npm dist-tag (empty: stable->latest, pre-release->release_type)"
        required: false
        type: string
        default: ""
      dry_run:
        description: "Dry run (skip actual publish)"
        required: false
        type: boolean
        default: false

permissions:
  id-token: write

concurrency:
  group: codex-pushtodisplay-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish codex-pushtodisplay
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Check (typecheck + lint + tests)
        run: npm run check

      - name: Determine version
        id: version
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          BASE=$(echo "$CURRENT" | sed 's/-.*//')

          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"
          case "${{ inputs.version_bump }}" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac
          BUMPED="${MAJOR}.${MINOR}.${PATCH}"

          if [[ "${{ inputs.release_type }}" == "stable" ]]; then
            NEW_VERSION="$BUMPED"
          else
            TAG="${{ inputs.release_type }}"
            PRE_NUM=$(node -e "
              let versions = [];
              try {
                versions = JSON.parse(require('child_process').execSync(
                  'npm view codex-pushtodisplay versions --json', { encoding: 'utf8' }
                ).trim() || '[]');
              } catch {}
              if (!Array.isArray(versions)) versions = [versions];
              const prefix = '${BUMPED}-${TAG}.';
              const max = versions
                .filter(v => typeof v === 'string' && v.startsWith(prefix))
                .map(v => parseInt(v.slice(prefix.length), 10))
                .filter(n => !isNaN(n))
                .reduce((a, b) => Math.max(a, b), -1);
              console.log(max + 1);
            ")
            NEW_VERSION="${BUMPED}-${TAG}.${PRE_NUM}"
          fi

          if [[ -n "${{ inputs.npm_tag }}" ]]; then
            DIST_TAG="${{ inputs.npm_tag }}"
          elif [[ "${{ inputs.release_type }}" == "stable" ]]; then
            DIST_TAG="latest"
          else
            DIST_TAG="${{ inputs.release_type }}"
          fi

          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$DIST_TAG" >> "$GITHUB_OUTPUT"
          echo "Will publish codex-pushtodisplay@${NEW_VERSION} with tag: ${DIST_TAG}"

      - name: Set version in package.json
        run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Publish to npm
        if: ${{ inputs.dry_run == false }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --tag ${{ steps.version.outputs.tag }}

      - name: Dry run publish
        if: ${{ inputs.dry_run == true }}
        run: |
          echo "DRY RUN - would publish:"
          echo "  Package: codex-pushtodisplay@${{ steps.version.outputs.version }}"
          echo "  Tag: ${{ steps.version.outputs.tag }}"
          npm pack --dry-run

      - name: Commit version & create git tag
        if: ${{ inputs.dry_run == false }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: release v${{ steps.version.outputs.version }}"
          git tag "codex-pushtodisplay-v${{ steps.version.outputs.version }}"
          git push origin HEAD "codex-pushtodisplay-v${{ steps.version.outputs.version }}"

      - name: Verify publish
        if: ${{ inputs.dry_run == false }}
        run: |
          echo "Waiting for npm registry propagation..."
          sleep 10
          npm info codex-pushtodisplay@${{ steps.version.outputs.version }} version
          echo "codex-pushtodisplay@${{ steps.version.outputs.version }} is live"
